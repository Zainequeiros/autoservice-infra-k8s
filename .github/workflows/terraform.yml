# CI/CD Terraform — autoservice-infra-k8s
# Padrão: develop → homolog | main → prod
# PR: fmt + validate (+ plan com credenciais AWS)
# Push: apply somente do ambiente da branch (sem job fantasma)

name: CI/CD Terraform

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: infra-k8s-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TERRAFORM_VERSION: "1.6.6"
  AWS_REGION_DEFAULT: us-east-1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

  validate:
    name: Validate (${{ matrix.environment }})
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        environment: [homolog, prod]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  plan:
    name: Plan (${{ matrix.environment }})
    if: github.event_name == 'pull_request'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        environment: [homolog, prod]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
      TF_STATE_LOCK_TABLE: ${{ secrets.TERRAFORM_LOCK_TABLE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=autoservice-infra-k8s/${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform Plan
        env:
          TF_VAR_dd_api_key: ${{ secrets.DD_API_KEY }}
        run: terraform plan -lock=false -no-color -out=tfplan

  apply-homolog:
    name: Apply (homolog)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: validate
    runs-on: ubuntu-latest
    environment: homolog
    defaults:
      run:
        working-directory: terraform/environments/homolog
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
      TF_STATE_LOCK_TABLE: ${{ secrets.TERRAFORM_LOCK_TABLE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=autoservice-infra-k8s/homolog/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform Apply
        env:
          TF_VAR_dd_api_key: ${{ secrets.DD_API_KEY }}
        run: terraform apply -auto-approve -lock=false

  apply-prod:
    name: Apply (prod)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: terraform/environments/prod
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
      TF_STATE_LOCK_TABLE: ${{ secrets.TERRAFORM_LOCK_TABLE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=autoservice-infra-k8s/prod/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform Apply
        env:
          TF_VAR_dd_api_key: ${{ secrets.DD_API_KEY }}
        run: terraform apply -auto-approve -lock=false
