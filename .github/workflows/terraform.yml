name: terraform-ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

  validate:
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        environment: [homolog, prod]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  plan:
    if: github.event_name == 'pull_request'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        environment: [homolog, prod]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
      TF_STATE_LOCK_TABLE: ${{ secrets.TERRAFORM_LOCK_TABLE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=autoservice-infra-k8s/${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform Plan
        env:
          TF_VAR_dd_api_key: ${{ secrets.DD_API_KEY }}
        run: terraform plan -lock=false -no-color -out=tfplan

  apply:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: refs/heads/develop
            environment: homolog
          - branch: refs/heads/main
            environment: prod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
      TF_STATE_LOCK_TABLE: ${{ secrets.TERRAFORM_LOCK_TABLE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: github.ref == matrix.branch
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        if: github.ref == matrix.branch
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        if: github.ref == matrix.branch
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=autoservice-infra-k8s/${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform Apply
        if: github.ref == matrix.branch
        env:
          TF_VAR_dd_api_key: ${{ secrets.DD_API_KEY }}
        run: terraform apply -auto-approve -lock=false